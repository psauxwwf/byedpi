name: Build & Release Linux amd64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build static binary (amd64)
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Build static binary
        run: |
          gcc -O2 -static -pthread \
            -o byedpi \
            main.c conev.c desync.c extend.c mpool.c packets.c proxy.c

      - name: Verify binary
        run: |
          file byedpi
          ldd byedpi || echo "Static binary (no dynamic dependencies)"

      - name: Strip binary
        run: strip byedpi || true

      - name: Pack artifact
        run: |
          tar -czf byedpi-linux-amd64.tar.gz byedpi
          sha256sum byedpi-linux-amd64.tar.gz > byedpi-linux-amd64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-linux-amd64
          path: |
            byedpi
            byedpi-linux-amd64.tar.gz
            byedpi-linux-amd64.tar.gz.sha256
          if-no-files-found: error

      - name: Generate tag
        id: tag
        run: |
          TAG="v$(date -u +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: byedpi-linux-amd64
          path: ./dist

      - name: Create and push tag
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/byedpi
            dist/byedpi-linux-amd64.tar.gz
            dist/byedpi-linux-amd64.tar.gz.sha256
          fail_on_unmatched_files: true
